<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Sıfırlama - İş Zekası Platformu</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M3 3h2v18H3V3zm6 8h2v10H9V11zm6-5h2v15h-2V6zm6 4h2v11h-2v-11z'/></svg>">
    
    <link id="theme-style" rel="stylesheet" href="../static/css/forgot_light.css">
</head>
<body>

    <div class="split-layout">
        
        <!-- Sol Taraf: Marka Alanı -->
        <div class="brand-panel">
            <div class="brand-content">
                <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 20V10M12 20V4M6 20v-6"/>
                </svg>
                <h1>İş Zekası Platformu</h1>
                <p>Yerli ve milli iş zekası çözümü.</p>
            </div>
        </div>

        <!-- Sağ Taraf: Form ve Kontroller -->
        <div class="form-panel">
            
            <div class="top-controls">
                <button class="theme-toggle" onclick="toggleTheme()" title="Temayı Değiştir">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>

            <!-- Merkezdeki Şifre Sıfırlama Formu -->
            <div class="form-wrapper">
                <h2>Şifrenizi mi Unuttunuz?</h2>
                <p class="subtitle">Sıfırlama bağlantısı için sicil numaranızı ve e-posta adresinizi girin.</p>

                <!-- SİCİL NUMARASI ALANI (ÜSTE ALINDI) -->
                <div class="input-group">
                    <label for="sicil-no">Sicil Numarası</label>
                    <div class="input-wrapper">
                        <!-- Personel Kartı / Kimlik İkonu -->
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                            <circle cx="9" cy="11" r="2"></circle>
                            <path d="M6.17 15a3 3 0 0 1 5.66 0"></path>
                            <path d="M16 10h2"></path>
                            <path d="M16 14h2"></path>
                        </svg>
                        <input type="text" id="sicil-no" placeholder="Örn: 123456" required>
                    </div>
                </div>

                <!-- E-POSTA ADRESİ ALANI (ALTA ALINDI) -->
                <div class="input-group">
                    <label for="email">E-posta Adresi</label>
                    <div class="input-wrapper">
                        <!-- Zarf İkonu -->
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" id="email" placeholder="kurulum@sistem.com" required>
                    </div>
                </div>
                
                <button class="login-btn" onclick="alert('Motor bağlandığında sicil no ve e-posta kontrolü yapılıp mail gönderilecek.')">Sıfırlama Bağlantısı Gönder</button>

                <!-- Giriş Ekranına Geri Dön Linki -->
                <div class="forgot-password">
                    <a href="../index.html" class="forgot-password-link">← Giriş ekranına dön</a>
                </div>
            </div>

            <div class="panel-footer">
                &copy; 2026 İş Zekası Platformu. Tüm hakları saklıdır.
            </div>

        </div>
    </div>

    <script>
        const themeStyle = document.getElementById('theme-style');
        
        const savedTheme = localStorage.getItem('user-theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        let currentTheme = 'light';
        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
            currentTheme = 'dark';
        }

        function applyTheme(theme) {
            themeStyle.setAttribute('href', `../static/css/forgot_${theme}.css`);
        }
        
        applyTheme(currentTheme);

        function toggleTheme() {
            const isDark = themeStyle.getAttribute('href').includes('dark.css');
            const newTheme = isDark ? 'light' : 'dark';
            
            applyTheme(newTheme);
            localStorage.setItem('user-theme', newTheme);
        }
    </script>

</body>
</html>
