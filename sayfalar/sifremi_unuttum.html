<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Sıfırlama - İş Zekası Platformu</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M3 3h2v18H3V3zm6 8h2v10H9V11zm6-5h2v15h-2V6zm6 4h2v11h-2v-11z'/></svg>">
    
    <link id="theme-style" rel="stylesheet" href="/static/css/forgot_light.css">
    <script>
        (function () {
            var t = localStorage.getItem('user-theme') ||
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (t === 'dark') {
                document.getElementById('theme-style').setAttribute('href', '/static/css/forgot_dark.css');
            }
        })();
    </script>

    <style>
        /* --- ÖZEL BİLDİRİM (TOAST) TASARIMI --- */
        #customToast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #customToast.show { transform: translateX(-50%) translateY(0); }
        .toast-error { background-color: #ef4444; border: 1px solid #dc2626; }
        .toast-success { background-color: #10b981; border: 1px solid #059669; }
        .toast-icon { width: 20px; height: 20px; }

        /* --- AUTOFILL SARI ARKA PLAN DÜZELTMESİ --- */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #0f172a inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        :root[data-theme="light"] input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            -webkit-text-fill-color: #1e293b !important;
        }
    </style>
</head>
<body>

    <div id="customToast">
        <svg id="toastIcon" class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        <span id="toastMessage">Bildirim mesajı buraya gelecek</span>
    </div>

    <div class="split-layout">
        
        <div class="brand-panel">
            <div class="brand-content">
                <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 20V10M12 20V4M6 20v-6"/>
                </svg>
                <h1>İş Zekası Platformu</h1>
                <p>Yerli ve milli iş zekası çözümü.</p>
            </div>
        </div>

        <div class="form-panel">
            
            <div class="top-controls">
                <button class="theme-toggle" onclick="toggleTheme()" title="Temayı Değiştir">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>

            <div class="form-wrapper">
                <h2>Şifrenizi mi Unuttunuz?</h2>
                <p class="subtitle">Sıfırlama bağlantısı için sicil numaranızı ve e-posta adresinizi girin.</p>

                <div class="input-group">
                    <label for="sicil-no">Sicil Numarası</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                            <circle cx="9" cy="11" r="2"></circle>
                            <path d="M6.17 15a3 3 0 0 1 5.66 0"></path>
                            <path d="M16 10h2"></path>
                            <path d="M16 14h2"></path>
                        </svg>
                        <input type="text" id="sicil-no" autocomplete="off" placeholder="Lütfen Sicil Numaranızı Giriniz" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">E-posta Adresi</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" id="email" autocomplete="off" placeholder="Lütfen E-posta Adresinizi Giriniz" required>
                    </div>
                </div>
                
                <button class="login-btn" onclick="handleForgotPassword(event)">Sıfırlama Bağlantısı Gönder</button>

                <div class="forgot-password">
                    <a href="/" class="forgot-password-link">← Giriş ekranına dön</a>
                </div>
            </div>

            <div class="panel-footer">
                &copy; 2026 İş Zekası Platformu. Tüm hakları saklıdır.
            </div>

        </div>
    </div>

    <script>
        // Bildirim Gösterme Fonksiyonu
        function showNotification(message, type) {
            const toast = document.getElementById('customToast');
            const msg = document.getElementById('toastMessage');
            const icon = document.getElementById('toastIcon');

            msg.innerText = message;

            if (type === 'success') {
                toast.className = 'toast-success show';
                icon.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>';
            } else {
                toast.className = 'toast-error show';
                icon.innerHTML = '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>';
            }

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Tema Değiştirme Fonksiyonu
        function toggleTheme() {
            const themeStyle = document.getElementById('theme-style');
            if (themeStyle.getAttribute('href').includes('light')) {
                themeStyle.setAttribute('href', '/static/css/forgot_dark.css');
                localStorage.setItem('user-theme', 'dark');
            } else {
                themeStyle.setAttribute('href', '/static/css/forgot_light.css');
                localStorage.setItem('user-theme', 'light');
            }
        }

        // Şifre Sıfırlama İsteği Gönderme Fonksiyonu
        async function handleForgotPassword(event) {
            event.preventDefault();

            const sicil_no = document.getElementById('sicil-no').value.trim();
            const email = document.getElementById('email').value.trim();
            const btn = document.querySelector('.login-btn'); // Sınıf adını düzelttik

            if (!sicil_no || !email) {
                showNotification("Lütfen sicil numarası ve e-posta adresinizi girin.", "error");
                return;
            }

            const originalText = btn.innerText;
            btn.innerText = "Gönderiliyor...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append("sicil", sicil_no);
            formData.append("email", email);

            try {
                const response = await fetch('/sifre-sifirlama-talep', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    showNotification(data.mesaj, "success");
                    
                    document.getElementById('sicil-no').value = '';
                    document.getElementById('email').value = '';
                    setTimeout(() => {
                        window.location.href = "/";
                    }, 2000);
                } else {
                    showNotification(data.detail || "Bir hata oluştu, lütfen tekrar deneyin.", "error");
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Hata:", error);
                showNotification("Sunucuya ulaşılamıyor. Lütfen bağlantınızı kontrol edin.", "error");
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
