<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kurulumu - İş Zekası Platformu</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M3 3h2v18H3V3zm6 8h2v10H9V11zm6-5h2v15h-2V6zm6 4h2v11h-2v-11z'/></svg>">
    
    <link id="theme-style" rel="stylesheet" href="/static/css/setup_light.css">
    <!-- FOUC Önleme: body render edilmeden doğru tema yüklenir -->
    <script>
        (function () {
            var t = localStorage.getItem('user-theme') ||
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (t === 'dark') {
                document.getElementById('theme-style').setAttribute('href', '/static/css/setup_dark.css');
            }
        })();
    </script>
</head>
<body>

    <div class="split-layout">
        
        <!-- Sol Taraf: Marka Alanı -->
        <div class="brand-panel">
            <div class="brand-content">
                <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <h1>Kurulum Sihirbazı</h1>
                <p>Platformunuzu ayağa kaldırmak için ilk yönetici hesabını oluşturun.</p>
            </div>
        </div>

        <!-- Sağ Taraf: Form ve Kontroller -->
        <div class="form-panel">
            
            <div class="top-controls">
                <button class="theme-toggle" onclick="toggleTheme()" title="Temayı Değiştir">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>

            <!-- Merkezdeki Kurulum Formu -->
            <div class="form-wrapper">
                <h2>Hoş Geldiniz</h2>
                <p class="subtitle">Sistem yöneticisi (Admin) profilinizi tanımlayın.</p>

                <!-- Ad ve Soyad Yanyana -->
                <div class="row-group">
                    <div class="input-group half-width">
                        <label for="ad">Ad</label>
                        <div class="input-wrapper">
                            <input type="text" id="ad" placeholder="Örn: Ahmet" required>
                        </div>
                    </div>
                    
                    <div class="input-group half-width">
                        <label for="soyad">Soyad</label>
                        <div class="input-wrapper">
                            <input type="text" id="soyad" placeholder="Örn: Yılmaz" required>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="sicil-no">Sicil Numarası</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                            <circle cx="9" cy="11" r="2"></circle>
                            <path d="M6.17 15a3 3 0 0 1 5.66 0"></path>
                            <path d="M16 10h2"></path>
                            <path d="M16 14h2"></path>
                        </svg>
                        <input type="text" id="sicil-no" placeholder="Örn: 1001" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">E-posta Adresi</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" id="email" placeholder="admin@sirket.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Yönetici Parolası</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="password" placeholder="Güçlü bir parola belirleyin" required>
                    </div>
                </div>
                
                <button class="login-btn" onclick="alert('Kurulum tamamlanıyor...')">Sistemi Başlat</button>
            </div>

            <div class="panel-footer">
                &copy; 2026 İş Zekası Platformu. İlk Kurulum Ekranı.
            </div>

        </div>
    </div>

    <script>
        // Tema localStorage'dan okunur — DOM'a asla bağımlı değiliz
        function initTheme() {
            if (!localStorage.getItem('user-theme')) {
                var t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                localStorage.setItem('user-theme', t);
            }
        }

        function applyTheme(theme) {
            document.getElementById('theme-style').setAttribute('href', '/static/css/setup_' + theme + '.css');
        }

        function toggleTheme() {
            var newTheme = localStorage.getItem('user-theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('user-theme', newTheme);
            applyTheme(newTheme);
        }

        initTheme();
    </script>

</body>
</html>
