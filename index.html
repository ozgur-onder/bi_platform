<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İş Zekası Platformu</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M3 3h2v18H3V3zm6 8h2v10H9V11zm6-5h2v15h-2V6zm6 4h2v11h-2v-11z'/></svg>">
    
    <link id="theme-style" rel="stylesheet" href="/static/css/light.css">
    <!-- FOUC Önleme: body render edilmeden doğru tema yüklenir -->
    <script>
        (function () {
            var t = localStorage.getItem('user-theme') ||
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (t === 'dark') {
                document.getElementById('theme-style').setAttribute('href', '/static/css/dark.css');
            }
        })();
    </script>
</head>
<body>

    <div class="split-layout">
        
        <!-- Sol Taraf: Tam Ekran Kesintisiz Marka Alanı -->
        <div class="brand-panel">
            <div class="brand-content">
                <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 20V10M12 20V4M6 20v-6"/>
                </svg>
                <h1>İş Zekası Platformu</h1>
                <p>Yerli ve milli iş zekası çözümü.</p>
            </div>
        </div>

        <!-- Sağ Taraf: Form ve Yüzen Kontroller -->
        <div class="form-panel">
            
            <!-- Sağ Üstte Yüzen Tema Butonu -->
            <div class="top-controls">
                <button class="theme-toggle" onclick="toggleTheme()" title="Temayı Değiştir">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>

            <!-- Merkezdeki Giriş Formu -->
            <div class="form-wrapper">
                <h2>Hesabınıza Giriş Yapın</h2>
                <p class="subtitle">Devam etmek için bilgilerinizi girin.</p>

                <div class="input-group">
                    <label for="email">E-posta Adresi</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" id="email" placeholder="Lütfen E-posta Adresinizi Giriniz" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="password">Şifre</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>
                
                <button class="login-btn" onclick="alert('Motor bağlantısı bekleniyor...')">Giriş Yap</button>

                <div class="forgot-password">
                    <a href="#" onclick="sayfaYukle(event, 'sifremi_unuttum')" class="forgot-password-link">Şifremi unuttum</a>
                </div>
            </div>

            <!-- Sağ Altta Yüzen Alt Bilgi (Footer) -->
            <div class="panel-footer">
                &copy; 2026 İş Zekası Platformu. Tüm hakları saklıdır.
            </div>

        </div>
    </div>

    <script>
        // Tema localStorage'dan okunur — DOM'a asla bağımlı değiliz
        function initTheme() {
            if (!localStorage.getItem('user-theme')) {
                var t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                localStorage.setItem('user-theme', t);
            }
            // Tema zaten head'deki FOUC scripti tarafından uygulandı;
            // burada sadece localStorage'ın dolu olduğunu garantiliyoruz.
        }

        function applyTheme(theme) {
            document.getElementById('theme-style').setAttribute('href', '/static/css/' + theme + '.css');
        }

        function toggleTheme() {
            var newTheme = localStorage.getItem('user-theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('user-theme', newTheme);
            applyTheme(newTheme);
        }

        initTheme();

        // URL DEĞİŞTİRMEDEN SAYFA YÜKLEME MOTORU
        async function sayfaYukle(event, sayfaAdi) {
            event.preventDefault();
            try {
                const response = await fetch('/bilesen/' + sayfaAdi);
                if (!response.ok) {
                    throw new Error("Bileşen bulunamadı.");
                }
                const html = await response.text();
                document.open();
                document.write(html);
                document.close();
            } catch (error) {
                console.error("Sayfa yüklenirken hata oluştu:", error);
                alert("Sayfa yüklenemedi. Lütfen tekrar deneyin.");
            }
        }
    </script>

</body>
</html>
