<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İş Zekası Platformu</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M3 3h2v18H3V3zm6 8h2v10H9V11zm6-5h2v15h-2V6zm6 4h2v11h-2v-11z'/></svg>">
    
    <link id="theme-style" rel="stylesheet" href="/static/css/light.css">
    <script>
        (function () {
            var t = localStorage.getItem('user-theme') ||
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (t === 'dark') {
                document.getElementById('theme-style').setAttribute('href', '/static/css/dark.css');
            }
        })();
    </script>

    <style>
        /* --- ÖZEL BİLDİRİM (TOAST) TASARIMI --- */
        #customToast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #customToast.show { transform: translateX(-50%) translateY(0); }
        .toast-error { background-color: #ef4444; border: 1px solid #dc2626; }
        .toast-success { background-color: #10b981; border: 1px solid #059669; }
        .toast-icon { width: 20px; height: 20px; }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        /* --- AUTOFILL SARI ARKA PLAN DÜZELTMESİ --- */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #0f172a inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        :root[data-theme="light"] input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            -webkit-text-fill-color: #1e293b !important;
        }

        /* --- ŞİFRE GÖSTER/GİZLE BUTONU TASARIMI --- */
        .toggle-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: currentColor;
            opacity: 0.7;
            padding: 0;
            display: flex;
        }
        .toggle-btn:hover { opacity: 1; }
    </style>
</head>
<body>

    <div id="customToast">
        <svg id="toastIcon" class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        <span id="toastMessage">Bildirim mesajı buraya gelecek</span>
    </div>

    <div class="split-layout">
        
        <div class="brand-panel">
            <div class="brand-content">
                <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 20V10M12 20V4M6 20v-6"/>
                </svg>
                <h1>İş Zekası Platformu</h1>
                <p>Yerli ve milli iş zekası çözümü.</p>
            </div>
        </div>

        <div class="form-panel">
            
            <div class="top-controls">
                <button class="theme-toggle" onclick="toggleTheme()" title="Temayı Değiştir">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>

            <div class="form-wrapper">
                <h2>Hesabınıza Giriş Yapın</h2>
                <p class="subtitle">Devam etmek için bilgilerinizi girin.</p>

                <div class="input-group">
                    <label for="kullanici_adi">Sicil Numarası</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                            <circle cx="9" cy="11" r="2"></circle>
                            <path d="M6.17 15a3 3 0 0 1 5.66 0"></path>
                            <path d="M16 10h2"></path>
                            <path d="M16 14h2"></path>
                        </svg>
                        <input type="text" id="kullanici_adi" autocomplete="off" placeholder="Lütfen Sicil Numaranızı Giriniz" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="password">Şifre</label>
                    <div class="input-wrapper" style="position: relative;">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="password" autocomplete="new-password" placeholder="••••••••" style="padding-right: 40px;" required>
                        <!-- Şifre Göster/Gizle Butonu Eklendi -->
                        <button type="button" class="toggle-btn" onclick="sifreGosterGizle('password', 'eye1')">
                            <svg id="eye1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                
                <button class="login-btn" id="loginBtn" onclick="girisYap()">Giriş Yap</button>

                <div class="forgot-password">
                    <a href="/bilesen/sifremi_unuttum" class="forgot-password-link">Şifremi unuttum</a>
                </div>
            </div>

            <div class="panel-footer">
                &copy; 2026 İş Zekası Platformu. Tüm hakları saklıdır.
            </div>

        </div>
    </div>

    <script>
        function initTheme() {
            var t = localStorage.getItem('user-theme');
            if (!t) {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                localStorage.setItem('user-theme', t);
            }
            document.documentElement.setAttribute('data-theme', t);
        }

        function applyTheme(theme) {
            document.getElementById('theme-style').setAttribute('href', '/static/css/' + theme + '.css');
            document.documentElement.setAttribute('data-theme', theme);
        }

        function toggleTheme() {
            var newTheme = localStorage.getItem('user-theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('user-theme', newTheme);
            applyTheme(newTheme);
        }
        initTheme();

        let toastTimeout;
        function showNotification(message, type = 'error') {
            const toast = document.getElementById('customToast');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            if (type === 'error') {
                toast.className = 'toast-error';
                toastIcon.innerHTML = '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>';
            } else {
                toast.className = 'toast-success';
                toastIcon.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>';
            }

            toastMsg.innerText = message;
            toast.classList.add('show');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // --- ŞİFRE GÖSTER/GİZLE FONKSİYONU EKLENDİ ---
        function sifreGosterGizle(inputId, iconId) {
            var input = document.getElementById(inputId);
            var icon = document.getElementById(iconId);
            
            if (input.type === "password") {
                input.type = "text";
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                input.type = "password";
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        async function girisYap() {
            const sicil = document.getElementById('kullanici_adi').value.trim();
            const pass = document.getElementById('password').value;

            if (!sicil || !pass) {
                showNotification("Lütfen sicil numaranızı ve şifrenizi girin.", "error");
                return;
            }

            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerText;
            btn.innerText = "Giriş yapılıyor...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append("kullanici_adi", sicil);
            formData.append("sifre", pass);

            try {
                const response = await fetch('/giris-yap', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    showNotification(data.mesaj, "success");
                    setTimeout(() => {
                        window.location.href = "/platform"; 
                    }, 1000);
                } else {
                    showNotification("Sicil numarası veya şifre hatalı.", "error");
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Hata:", error);
                showNotification("Sunucuya bağlanılamadı.", "error");
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
